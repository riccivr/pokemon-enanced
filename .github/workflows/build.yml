name: Build Pokémon ENANCED

on:
  push:
    branches: [ master, 'phase*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout agbcc compiler
        uses: actions/checkout@v4
        with:
          path: 'agbcc'
          repository: 'pret/agbcc'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build and install agbcc
        working-directory: ./agbcc
        run: |
          ./build.sh
          ./install.sh ../

      - name: Compile Pokémon ENANCED ROM
        env:
          COMPARE: 0
        run: |
          make -j$(nproc)
          cp pokefirered.gba pokemon-enanced.gba

      - name: Upload playable ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-enanced-rom
          path: pokemon-enanced.gba
          retention-days: 14
